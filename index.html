<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Cogworks: a puzzle game where you program a grid of machines in Cog." />
    <title>Cogworks</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e5a04b' stroke-width='6' stroke-dasharray='4 3'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <h1>Cogworks</h1>
      <span class="tag">program the machines, solve the level</span>
    </header>
    <div class="layout">
      <nav class="panel levels" aria-label="Levels">
        <h2>Levels</h2>
        <ol id="level-list"></ol>
      </nav>

      <main class="panel stage">
        <h2 id="level-title"></h2>
        <p id="level-desc" class="desc"></p>
        <div id="inputs" class="streams" aria-label="Input streams"></div>
        <svg id="board" role="group" aria-label="Machine grid" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="outputs" class="streams" aria-label="Outputs"></div>

        <div class="controls" role="group" aria-label="Run controls">
          <button id="btn-run" type="button">Run</button>
          <button id="btn-pause" type="button">Pause</button>
          <button id="btn-step" type="button">Step</button>
          <button id="btn-reset" type="button">Reset</button>
          <label class="speed">
            Speed
            <input id="speed" type="range" min="1" max="60" step="1" value="4" />
            <output id="speed-out" for="speed">4 ticks/s</output>
          </label>
          <span id="tick-count" class="ticks" aria-live="off">tick 0</span>
        </div>

        <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
      </main>

      <section class="panel editor-panel" aria-label="Machine editor">
        <div class="editor-head">
          <h2 id="editor-title">Machine</h2>
          <span id="line-count" class="line-count"></span>
        </div>
        <div id="editor" class="editor"></div>
        <p class="hint">
          Ports: <code>UP</code> <code>DOWN</code> <code>LEFT</code> <code>RIGHT</code>.
          <code>send(port, value)</code> and <code>recv(port)</code> wait for the neighbour. Blank lines and
          comments are free.
        </p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
